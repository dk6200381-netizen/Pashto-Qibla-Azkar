<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>پښتو قبله او اذکار</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f5f1;color:#173d30;font-family:Arial,sans-serif}
header{background:#123d32;color:white;text-align:center;padding:24px}
header h1{margin:5px}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px}
button{border:0;border-radius:12px;padding:12px 16px;background:#176b50;color:white;font-size:16px}
main{max-width:600px;margin:auto;padding:12px}
.card{background:white;border-radius:18px;padding:20px;margin:12px 0;text-align:center;box-shadow:0 3px 12px #0001}
.compass{width:245px;height:245px;border:8px solid #176b50;border-radius:50%;margin:20px auto;position:relative;display:flex;align-items:center;justify-content:center;background:#f8fcf8}
.north{position:absolute;top:8px;font-weight:bold;color:#c0392b}
.needle{font-size:75px;color:#c28b24;transform:rotate(0deg)}
.small{font-size:14px;color:#66776e;line-height:1.8}
.azkar{text-align:right;line-height:2;font-size:19px}
.count{font-size:25px;color:#176b50;font-weight:bold}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>🕌 قبله او ورځني اذکار</h1>
<p>ستاسو د عبادت ملګری</p>
</header>

<nav>
<button onclick="show('qibla')">🧭 قبله نما</button>
<button onclick="show('morning')">🌅 سهار اذکار</button>
<button onclick="show('evening')">🌙 ماښام اذکار</button>
</nav>

<main>
<section id="qibla" class="card">
<h2>🧭 د قبلې سمت</h2>
<div class="compass">
<span class="north">شمال N</span>
<div class="needle" id="needle">⬆</div>
</div>
<h2>۲۵۲.۷ درجې</h2>
<p id="status" class="small">د کمپاس د فعالولو لپاره تڼۍ کېکاږئ.</p>
<button onclick="startCompass()">کمپاس فعال کړه</button>
<p class="small">موبایل افقي ونیسئ. د کمپاس دقت د موبایل په سنسر پورې تړلی دی.</p>
</section>

<section id="morning" class="card" hidden>
<h2>🌅 د سهار اذکار</h2>
<div id="morningList"></div>
</section>

<section id="evening" class="card" hidden>
<h2>🌙 د ماښام اذکار</h2>
<div id="eveningList"></div>
</section>
</main>

<script>
function show(id){
document.querySelectorAll('main section').forEach(s=>s.hidden=true);
document.getElementById(id).hidden=false;
}

const azkar=[
["أَسْتَغْفِرُ اللَّهَ","له الله څخه بښنه غواړم",100],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","الله پاک دی او د هغه ستاینه کوم",100],
["لَا إِلَهَ إِلَّا اللَّهُ","له الله پرته بل معبود نشته",10],
["سُبْحَانَ اللَّهِ","الله پاک دی",33],
["الْحَمْدُ لِلَّهِ","ټولې ستاینې الله لره دي",33],
["اللَّهُ أَكْبَرُ","الله تر ټولو لوی دی",34]
];

function makeAzkar(id){
const area=document.getElementById(id);
azkar.forEach((z,i)=>{
const div=document.createElement('div');
div.className='card azkar';
div.innerHTML=`<b>${z[0]}</b><br>
<span class="small">${z[1]}</span><br>
<span class="count" id="${id}${i}">${z[2]}</span><br>
<button onclick="countDown('${id}${i}')">تسبیح ووایه</button>
<button onclick="resetCount('${id}${i}',${z[2]})">بیا پیل</button>`;
area.appendChild(div);
});
}
function countDown(id){
let el=document.getElementById(id);
let n=Number(el.innerText);
if(n>0)el.innerText=n-1;
}
function resetCount(id,n){
document.getElementById(id).innerText=n;
}
makeAzkar('morningList');
makeAzkar('eveningList');

const QIBLA=252.7;
let compassStarted=false;

function updateCompass(e){
let heading=null;

if(typeof e.webkitCompassHeading==='number'){
heading=e.webkitCompassHeading;
}else if(e.absolute===true && typeof e.alpha==='number'){
heading=(360-e.alpha)%360;
}else if(typeof e.alpha==='number' && e.absolute!==false){
heading=(360-e.alpha)%360;
}

if(heading===null)return;

const screenAngle=screen.orientation?.angle || 0;
heading=(heading-screenAngle+360)%360;

const rotation=(QIBLA-heading+360)%360;
document.getElementById('needle').style.transform=
`rotate(${rotation}deg)`;

document.getElementById('status').innerText=
'کمپاس معلومات ترلاسه کوي. موبایل ورو ورو وڅرخوئ.';
}

async function startCompass(){
const status=document.getElementById('status');

if(!window.isSecureContext){
status.innerText='دا پاڼه باید د HTTPS له لارې خلاصه شي.';
return;
}

try{
if(typeof DeviceOrientationEvent!=='undefined' &&
typeof DeviceOrientationEvent.requestPermission==='function'){
const permission=await DeviceOrientationEvent.requestPermission();
if(permission!=='granted'){
status.innerText='د کمپاس اجازه ورنه کړل شوه.';
return;
}
}
window.addEventListener('deviceorientation',updateCompass,true);
window.addEventListener('deviceorientationabsolute',updateCompass,true);
compassStarted=true;
status.innerText='کمپاس فعال شو. موبایل هوار ونیسئ.';
}catch(err){
status.innerText='کمپاس فعال نه شو. د موبایل سنسر وګورئ.';
}
}
</script>
</body>
</html>
