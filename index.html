<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>پښتو قبله او اذکار</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f3;color:#17352c;font-family:Arial,sans-serif}
header{background:#123d32;color:white;text-align:center;padding:24px 12px}
header h2{margin:5px}
nav{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:12px}
button{border:0;border-radius:12px;padding:12px 16px;background:#17634d;color:white;font-size:16px;cursor:pointer}
button.active{background:#c28b24}
main{max-width:650px;margin:auto;padding:12px}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0000000d}
h3{color:#17634d;margin-top:0}
#compass{width:230px;height:230px;border:8px solid #17634d;border-radius:50%;margin:20px auto;position:relative;display:flex;align-items:center;justify-content:center;background:#f8faf8}
#needle{font-size:75px;color:#c28b24;transition:transform .15s}
#north{position:absolute;top:8px;font-weight:bold}
.big{font-size:30px;text-align:center;font-weight:bold;color:#17634d}
.arabic{font-size:25px;line-height:2;text-align:center;color:#123d32;margin:12px 0}
.translation{text-align:center;line-height:1.9;color:#555}
.counter{text-align:center;font-size:40px;margin:15px}
.hidden{display:none}
.small{font-size:13px;color:#777;text-align:center}
</style>
</head>
<body>
<header>
<h2>🕌 پښتو قبله او اذکار</h2>
<p>د عبادت لپاره ستاسو ملګری</p>
</header>

<nav>
<button class="active" onclick="showPage('qibla',this)">قبله</button>
<button onclick="showPage('morning',this)">سهار اذکار</button>
<button onclick="showPage('evening',this)">ماښام اذکار</button>
<button onclick="showPage('tasbih',this)">تسبیح</button>
</nav>

<main>
<section id="qibla" class="page">
<div class="card">
<h3>🧭 د قبلې کمپاس</h3>
<div id="compass">
<span id="north">شمال</span>
<span id="needle">⬆</span>
</div>
<div class="big">۲۵۲.۷°</div>
<p class="translation">د ښرنې لپاره اټکلي د قبلې زاویه</p>
<button style="width:100%" onclick="startCompass()">کمپاس فعال کړه</button>
<p class="small">موبایل هوار ونیسه او له فلزي شیانو لرې یې وساته. د کمپاس دقت د موبایل له سنسر سره تړلی دی.</p>
</div>
</section>

<section id="morning" class="page hidden">
<div class="card">
<h3>🌅 د سهار اذکار</h3>
<div id="morningList"></div>
</div>
</section>

<section id="evening" class="page hidden">
<div class="card">
<h3>🌇 د ماښام اذکار</h3>
<div id="eveningList"></div>
</div>
</section>

<section id="tasbih" class="page hidden">
<div class="card">
<h3>📿 ډیجیټل تسبیح</h3>
<div class="counter" id="count">۰</div>
<button style="width:100%;font-size:22px;padding:22px" onclick="addCount()">تسبیح +</button>
<button style="width:100%;margin-top:10px;background:#a33" onclick="resetCount()">له سره پیل</button>
</div>
</section>
</main>

<script>
function showPage(id,btn){
 document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}

const morning=[
["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ","سهار مو کړ او ټول واک د الله دی.",1],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","الله پاک دی او د هغه ستاینه کوم.",100],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","له الله بښنه غواړم او هغه ته توبه کوم.",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","اې الله! زموږ پر پیغمبر محمد ﷺ رحمت او سلام نازل کړه.",10]
];

const evening=[
["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ","ماښام مو کړ او ټول واک د الله دی.",1],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","الله پاک دی او د هغه ستاینه کوم.",100],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","له الله بښنه غواړم او هغه ته توبه کوم.",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","اې الله! زموږ پر پیغمبر محمد ﷺ رحمت او سلام نازل کړه.",10]
];

function renderList(items,id){
 document.getElementById(id).innerHTML=items.map((item,i)=>`
 <div class="card">
 <div class="arabic">${item[0]}</div>
 <div class="translation">${item[1]}</div>
 <p class="small">وړاندیز شوی شمېر: ${item[2]}</p>
 <button onclick="this.innerText='لوستل وشول ✓';this.disabled=true">لوستل وشول</button>
 </div>`).join('');
}
renderList(morning,'morningList');
renderList(evening,'eveningList');

let count=0;
function toPashto(n){
 return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
}
function addCount(){
 count++;
 document.getElementById('count').innerText=toPashto(count);
}
function resetCount(){
 count=0;
 document.getElementById('count').innerText='۰';
}

function startCompass(){
 if(typeof DeviceOrientationEvent!=='undefined' &&
 typeof DeviceOrientationEvent.requestPermission==='function'){
 DeviceOrientationEvent.requestPermission().then(permission=>{
 if(permission==='granted') listenCompass();
 else alert('د کمپاس اجازه ورکړه');
 }).catch(()=>alert('کمپاس فعال نه شو'));
 }else{
 listenCompass();
 }
}
function listenCompass(){
 window.addEventListener('deviceorientationabsolute',e=>{
 if(e.alpha!==null){
 document.getElementById('needle').style.transform=
 'rotate('+(252.7-e.alpha)+'deg)';
 }
 },true);
 window.addEventListener('deviceorientation',e=>{
 if(e.alpha!==null && !('ondeviceorientationabsolute' in window)){
 document.getElementById('needle').style.transform=
 'rotate('+(252.7-e.alpha)+'deg)';
 }
 },true);
}
</script>
</body>
</html>
